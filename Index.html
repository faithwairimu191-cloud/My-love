<!DOCTYPE html>
<html>
<head>
    <title>For My Love ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-image: url("https://i.ibb.co/840zh6QK/55ed7a98ccbce368837754056557455e.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Georgia, serif;
            text-align: center;
            color: white;
        }

        .message {
            background: rgba(0, 0, 0, 0.35);
            padding: 30px;
            border-radius: 20px;
            margin: 20px;
        }

        h1 {
            font-size: 42px;
        }

        p {
            font-size: 19px;
        }

        button {
            margin-top: 20px;
            padding: 14px 28px;
            border: none;
            border-radius: 30px;
            background: #8b1e3f;
            color: white;
            font-size: 17px;
        }
    </style>
</head>

<body>

    <div class="message">
        <h1>Hey baby ❤️</h1>
        <p>I made something special just for you...</p>
        <button>Open it 💌</button>
    </div>

</body>
</html>
